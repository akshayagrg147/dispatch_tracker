<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dispatch Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
:root{
  --paper:#F1F4F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --surface-3:#F7F9FC;
  --ink:#131A23; --ink-2:#3B4756; --muted:#6C7A8B;
  --rule:#DCE3EC; --rule-2:#C2CCDA;
  --accent:#12468C; --on-accent:#FFFFFF; --accent-soft:#E2ECFA;
  --ok:#0B6B4E; --ok-soft:#DDF0E8;
  --warn:#8E5314; --warn-soft:#FAEAD5;
  --bad:#A0241B; --bad-soft:#FAE3E0;
  --violet:#5B3E9B; --violet-soft:#EAE4F8;
  --shadow:0 1px 2px rgba(19,26,35,.06),0 8px 24px -12px rgba(19,26,35,.22);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1218; --surface:#151C25; --surface-2:#1D2631; --surface-3:#111821;
    --ink:#E8EDF4; --ink-2:#B6C1CF; --muted:#8492A3;
    --rule:#26303D; --rule-2:#35414F;
    --accent:#6FA9F2; --on-accent:#0B131C; --accent-soft:#12263D;
    --ok:#4FC391; --ok-soft:#0F2A20;
    --warn:#E2A75F; --warn-soft:#2B2013;
    --bad:#F0897E; --bad-soft:#2E1714;
    --violet:#AC90EC; --violet-soft:#211A33;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1218; --surface:#151C25; --surface-2:#1D2631; --surface-3:#111821;
  --ink:#E8EDF4; --ink-2:#B6C1CF; --muted:#8492A3;
  --rule:#26303D; --rule-2:#35414F;
  --accent:#6FA9F2; --on-accent:#0B131C; --accent-soft:#12263D;
  --ok:#4FC391; --ok-soft:#0F2A20;
  --warn:#E2A75F; --warn-soft:#2B2013;
  --bad:#F0897E; --bad-soft:#2E1714;
  --violet:#AC90EC; --violet-soft:#211A33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; min-height:100vh;
}
h1,h2,h3{font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 64px}
.masthead{
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding:22px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:0;
}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:700;line-height:1.1}
.brand .est{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);border-left:1px solid var(--rule-2);padding-left:12px
}
.mast-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--ink-2);padding:8px 13px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
  transition:background .14s,border-color .14s,color .14s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent);color:var(--on-accent);filter:brightness(1.08)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px}

/* ---------- notice ---------- */
.notice{
  display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  border-radius:var(--r);font-size:13px;color:var(--ink)
}
.notice strong{font-weight:600}
.notice .sp{flex:1}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:20px}
.kpi{background:var(--surface);padding:14px 16px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font-family:"Archivo",sans-serif;font-size:23px;font-weight:600;line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--muted)}
.kpi.is-alert .k-val{color:var(--warn)}
.kpi .meter{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:2px}
.kpi .meter span{display:block;height:100%;background:var(--warn)}
@media(max-width:1340px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;
  padding:12px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.search{position:relative;flex:1 1 240px;min-width:200px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--rule-2);border-radius:8px;
  background:var(--surface-3)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;flex-wrap:wrap}
.field label{white-space:nowrap}
.field select,.field input{min-width:0;flex:0 1 auto}
@media(max-width:640px){.field{width:100%}.field select,.field input{flex:1 1 auto}}
.toolbar>*{max-width:100%}
.chips{flex-wrap:wrap}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
select,input[type="date"],input[type="text"],input[type="number"],textarea{
  border:1px solid var(--rule-2);border-radius:8px;padding:7px 9px;background:var(--surface-3);
  color:var(--ink);max-width:100%}
select{cursor:pointer}
.chips{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.chip{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:12.5px;
  color:var(--ink-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tool-count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);margin-top:14px;
  overflow:hidden;box-shadow:var(--shadow)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
thead th{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:left;font-weight:500;padding:11px 12px;background:var(--surface-3);
  border-bottom:1px solid var(--rule-2);white-space:nowrap;position:sticky;top:0;z-index:2
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .arrow{opacity:.4;margin-left:3px}
thead th.on{color:var(--accent)} thead th.on .arrow{opacity:1}
tbody td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-3)}
.grp{border-left:1px solid var(--rule)}
.r-strip{width:3px;padding:0!important;border-bottom:1px solid var(--rule)}
.pay-Received{background:var(--ok)} .pay-COD{background:var(--warn)}
.pay-Credit{background:var(--violet)} .pay-Pending{background:var(--bad)}
.t-main{font-weight:600;color:var(--ink);line-height:1.3}
.t-sub{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.t-right{text-align:right}
.clamp{max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.print-only{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.flag{display:inline-block;margin-top:4px;font-size:10px;font-family:"IBM Plex Mono",monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--warn);
  border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);border-radius:5px;padding:1px 5px}
.row-acts{display:flex;gap:4px;justify-content:flex-end;opacity:.55;transition:opacity .14s}
tr:hover .row-acts{opacity:1}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px;
  cursor:pointer;color:var(--muted);display:inline-flex}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--rule)}
.iconbtn.del:hover{color:var(--bad);border-color:var(--bad)}
.empty{padding:64px 24px;text-align:center;color:var(--muted)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.empty p{max-width:44ch;margin:0 auto 16px}

/* ---------- summary panels ---------- */
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
@media(max-width:1180px){.panels{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--rule)}
.panel-h h3{font-size:14px;font-weight:600}
.panel-h .hint{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.panel-b{padding:6px 16px 14px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;
  border-bottom:1px solid var(--rule)}
.brow:last-child{border-bottom:0}
.brow .bname{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bval{font-variant-numeric:tabular-nums;font-weight:600}
.brow .bbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.brow .bbar span{display:block;height:100%;background:var(--accent)}
.brow.due .bval{color:var(--warn)} .brow.due .bbar span{background:var(--warn)}
.brow .bsub{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.panel .empty{padding:28px 16px;font-size:13px}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.55);backdrop-filter:blur(2px)}
.sheet{
  background:var(--surface);width:min(560px,100vw);max-height:100vh;height:100vh;
  margin-left:auto;display:flex;flex-direction:column;border-left:1px solid var(--rule);
  animation:slide .22s cubic-bezier(.2,.7,.3,1)
}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
dialog{position:fixed;inset:0;width:100%;height:100%}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--rule)}
.sheet-h h2{font-size:17px;font-weight:600}
.sheet-b{padding:16px 20px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--rule);
  background:var(--surface-3)}
fieldset{border:0}
.leg{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule);
  display:block;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;font-weight:500;color:var(--ink-2)}
.f input,.f select,.f textarea{width:100%}
.f .req{color:var(--bad)}
.f-full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px;min-height:0}
.confirm{background:var(--surface);border-radius:var(--r);padding:22px;width:min(400px,calc(100vw - 32px));
  margin:auto;box-shadow:var(--shadow)}
.confirm h2{font-size:16px;margin-bottom:8px}
.confirm p{color:var(--muted);font-size:13px;margin-bottom:18px}
.confirm .row{display:flex;gap:8px;justify-content:flex-end}
dialog.mid{display:none}
dialog.mid[open]{display:flex;align-items:center;justify-content:center}

/* ---------- saving veil ---------- */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 78%,transparent);
  display:none;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(1px)}
.veil.on{display:flex}
.veil .box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px 22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;font-size:13.5px}
.spin{width:15px;height:15px;border:2px solid var(--rule-2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.ro-banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);
  color:var(--ink-2);font-size:12.5px;border:1px solid var(--rule)}
.footnote{margin-top:22px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}

/* ---------- print ---------- */
.print-head{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#000;font-size:9.5pt}
  .masthead,.toolbar,.kpis,.panels,.notice,.ro-banner,.footnote,.row-acts,dialog,.veil,.toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .print-head{display:block;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .print-head h1{font-size:15pt} .print-head p{font-size:9pt;color:#333;margin-top:2px}
  .card{border:0;box-shadow:none;margin:0}
  table{min-width:0;width:100%}
  thead th{background:#fff;color:#000;border-bottom:1.5px solid #000;position:static;font-size:7.5pt;padding:5px 4px}
  tbody td{border-bottom:.5px solid #999;padding:5px 4px;font-size:8.5pt}
  .r-strip{display:none} .pill{background:transparent!important;color:#000!important;padding:0;font-weight:600}
  .pill::before{display:none} .flag{display:none} .t-sub{color:#444}
  .arrow{display:none}
  .print-only{display:inline}
  tbody td:last-child{min-width:80px}
  tr{break-inside:avoid}
}

/* ---------- sign-in / setup gate ---------- */

.gate-brand{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:4px}
.gate-brand h1{font-size:22px;font-weight:700;line-height:1.1}
.gate-brand .est{display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.gate-p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.gate-p.muted{color:var(--muted);font-size:12.5px}
.gate-p code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--surface-2);
  padding:1px 5px;border-radius:4px}
.gate-code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.7;background:var(--surface-3);
  border:1px solid var(--rule);border-radius:8px;padding:12px;overflow-x:auto;color:var(--ink-2)}
.gate-code .ph{color:var(--accent);font-weight:600}

.btn-wide{width:100%;justify-content:center}


/* ---------- who is signed in ---------- */
.who{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 12px;border:1px solid var(--rule);
  border-radius:999px;background:var(--surface-3);max-width:260px}
.who-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.bad{background:var(--bad);color:#fff}
@media print{.who{display:none!important}}

/* ---------- inline field hint ---------- */
.hintline{font-size:11.5px;color:var(--muted);line-height:1.4}
.hintline.ok{color:var(--ok);font-weight:500}
.hintline.warn{color:var(--warn)}

/* ---------- telecaller manager ---------- */
.tc-box{width:min(430px,calc(100vw - 32px));text-align:left}
.tc-hint{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.tc-list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;
  max-height:240px;overflow-y:auto;margin-bottom:12px}
.tc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 13px;
  border-bottom:1px solid var(--rule);font-size:13.5px}
.tc-row:last-child{border-bottom:0}
.tc-empty{padding:18px 13px;color:var(--muted);font-size:13px;text-align:center}
.tc-add{display:flex;gap:8px;margin-bottom:18px}
.tc-add input{flex:1}

/* ---------- courier tracking ---------- */
.auto-tag{display:inline-block;margin-left:6px;font-size:9.5px;font-family:"IBM Plex Mono",monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);vertical-align:middle;
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:4px;padding:0 4px}
.t-sub.dim{color:var(--muted);opacity:.75;font-size:11px}
.cr-box{width:min(560px,calc(100vw - 32px))}
.cr-row{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:center}
.cr-check{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.cr-check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-check input{accent-color:var(--accent);width:15px;height:15px;flex:none}
.cr-slug{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 8px}
.cr-slug:disabled{opacity:.4}
.cr-add{display:grid;grid-template-columns:1fr 130px auto;gap:8px}
@media print{.auto-tag,.t-sub.dim{display:none!important}}

/* ---------- docket links & tracking panel ---------- */
.docket-link{color:var(--accent);text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--accent) 50%,transparent)}
.docket-link:hover{border-bottom-style:solid}
.trk-box{width:min(500px,calc(100vw - 32px));text-align:left}
.trk-row{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);
  font-size:13px;align-items:baseline}
.trk-row:last-of-type{border-bottom:0}
.trk-k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trk-v{min-width:0;overflow-wrap:anywhere}
.trk-dim{color:var(--muted);font-size:12px}
.trk-msg{margin-top:12px;padding:11px 13px;border-radius:8px;background:var(--surface-3);
  border:1px solid var(--rule);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.trk-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;text-decoration:none}
.trk-link:hover{text-decoration:underline}
.cr-row{grid-template-columns:1fr 116px auto}
.cr-url{grid-column:1/-1;font-size:12px;padding:5px 8px;font-family:"IBM Plex Mono",monospace}
.cr-url:disabled{opacity:.4}
.cr-add{grid-template-columns:1fr 116px auto}
#crUrl{grid-column:1/-1}
@media print{.docket-link{color:inherit;border:0}}

/* ---------- sign-in ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-split{display:grid;grid-template-columns:1.05fr 1fr;width:min(940px,100%);
  background:var(--surface);border:1px solid var(--rule);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(19,26,35,.05),0 24px 60px -28px rgba(19,26,35,.35)}
:root[data-theme="dark"] .gate-split{box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gate-split{box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}}

.gate-side{position:relative;background:#0F2E5C;color:#EAF1FB;padding:38px 34px;display:flex;align-items:center;
  isolation:isolate}
.gate-side::before{content:"";position:absolute;inset:0;z-index:-1;
  background:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(255,255,255,.055) 27px 28px)}
.gate-side::after{content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;z-index:-1;
  background:rgba(255,180,150,.25)}
.gate-side-in{position:relative;display:flex;flex-direction:column;gap:16px;width:100%}
.gate-mark{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);color:#fff}
.gate-mark svg{width:19px;height:19px}
.gate-title{font-size:27px;font-weight:700;line-height:1.08;color:#fff;letter-spacing:-.02em}
.gate-tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(234,241,251,.62)}
.gate-points{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:6px}
.gate-points li{position:relative;padding-left:20px;font-size:13.5px;line-height:1.5;color:rgba(234,241,251,.9)}
.gate-points li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;border-radius:2px;
  background:rgba(255,255,255,.4)}
.gate-side-foot{margin-top:8px;font-size:11.5px;color:rgba(234,241,251,.5);line-height:1.5}

.gate-main{display:flex;align-items:center;justify-content:center;padding:38px 34px}
.gate-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:15px;
  background:transparent;border:0;border-radius:0;box-shadow:none;padding:0}
.gate-head{display:flex;flex-direction:column;gap:5px;margin-bottom:2px}
.gate-h{font-size:20px;font-weight:600}
.gate-sub{font-size:13px;color:var(--muted);line-height:1.5}
.gate-card .f label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.gate-card input{padding:10px 11px;font-size:14px}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{width:100%;padding-right:42px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--muted);cursor:pointer;padding:7px;border-radius:6px;display:inline-flex}
.pw-eye:hover{color:var(--ink);background:var(--surface-2)}
.pw-eye[aria-pressed="true"]{color:var(--accent)}
.gate-card .btn-wide{padding:10px 13px;font-size:14px}
.btn-quiet{color:var(--muted);font-size:13px}
.btn-quiet:hover{color:var(--ink)}
.gate-card .spin{border-top-color:currentColor;border-color:rgba(255,255,255,.35);border-top-color:#fff}
#loginErr:not(:empty){padding:9px 11px;background:var(--bad-soft);color:var(--bad);border-radius:7px;font-size:12.5px}
.gate-foot{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;margin-top:2px}

@media(max-width:760px){
  .gate{padding:0;align-items:stretch}
  .gate-split{grid-template-columns:1fr;border:0;border-radius:0;box-shadow:none;min-height:100vh;
    align-content:start}
  .gate-side{padding:26px 24px 22px}
  .gate-points,.gate-side-foot{display:none}
  .gate-side::after{left:36px}
  .gate-main{padding:28px 24px 40px}
  .gate-card{max-width:none}
}
</style>

<script type="module">
/* ============================================================
   The browser talks to the local Node API. The API connects to
   AWS PostgreSQL; database credentials never belong in this file.
   ============================================================ */
const FIRST_INVOICE_NO  = 2166; // suggested when the register is empty

const PAYMENT = ["Received","COD","Credit","Pending"];
const PAYMENT_TONE = { Received:"ok", COD:"warn", Credit:"violet", Pending:"bad" };
const FREIGHT = ["Paid","Credit","COD"];
const FREIGHT_TONE = { Paid:"ok", Credit:"violet", COD:"warn" };
const STATUS = ["Dispatched","In Transit","Delivered","Returned"];
const ST_TONE = { Dispatched:"mute", "In Transit":"info", Delivered:"ok", Returned:"bad" };

let me = null, profile = null;
let orders = [], people = new Map(), tcallers = [], couriers = [];
let trackReady = null;   // null = not asked yet, false = no API key configured
let liveTimer = null;
let view = { q:"", range:"all", from:"", to:"", dateField:"dispatch_date",
             pay:"", freight:"", status:"", transport:"", area:"", tc:"", by:"",
             sort:"dispatch_date", dir:-1 };
try { Object.assign(view, JSON.parse(sessionStorage.getItem("dr:view") || "null") || {}); } catch {}

/* ---------------- pincode directory ---------------- */
const PD = JSON.parse(document.getElementById("pindata").textContent);
const PINS = (() => {
  const m = new Map(); let pin = 0;
  for (const rec of PD.packed.split(",")){
    const dot = rec.indexOf(".");
    pin += parseInt(rec.slice(0, dot), 36);
    m.set(String(pin).padStart(6,"0"), parseInt(rec.slice(dot+1), 36));
  }
  return m;
})();
function lookupPin(pin){
  const v = PINS.get(String(pin).trim());
  if (v === undefined) return null;
  const s = Math.floor(v / 100000);
  return { city: PD.cities[s][v % 100000], state: PD.states[s] };
}
const ALL_CITIES = [...new Set(PD.cities.flat())].sort((a,b) => a.localeCompare(b));
const citiesFor = state => {
  const i = PD.states.indexOf(state);
  return i < 0 ? ALL_CITIES : PD.cities[i];
};

/* ---------------- Excel + PDF writers ---------------- */
/* ============================================================
   Excel (.xlsx) and PDF writers — no libraries, no network.
   Both return a Uint8Array ready to hand to the browser.
   ============================================================ */

/* ---------- tiny ZIP writer (stored, no compression) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++){
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

  const chunks = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

  for (const f of files){
    const name = utf8(f.name), data = f.data;
    const crc = crc32(data);
    const local = [
      ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0),                        // time, date
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0)
    ];
    chunks.push(new Uint8Array(local), name, data);
    central.push([
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0),
      ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset)
    ]);
    offset += local.length + name.length + data.length;
    central[central.length - 1]._name = name;
  }
  const cdParts = [];
  let cdLen = 0;
  for (const c of central){
    const head = new Uint8Array(c), nm = c._name;
    cdParts.push(head, nm);
    cdLen += head.length + nm.length;
  }
  const eocd = new Uint8Array([
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length),

  ]);
  const all = [...chunks, ...cdParts, eocd];
  const total = all.reduce((n, a) => n + a.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const a of all){ out.set(a, p); p += a.length; }
  return out;
}

/* ---------- Excel ---------- */
const xesc = s => String(s ?? "")
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&apos;");
const colName = n => { let s = ""; n++; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
function dateSerial(iso){
  if (!iso) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  if (!m) return null;
  const ms = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  return Math.round(ms / 86400000) + 25569;   // 1970-01-01 → Excel serial
}

/**
 * cols:  [{key, label, type:"text"|"num"|"money"|"date", width}]
 * rows:  array of plain objects
 * title: sheet name
 */
function buildXlsx(cols, rows, title = "Dispatches"){
  const S = { HEAD:1, TEXT:0, DATE:2, MONEY:3, NUM:4, TOTLBL:5, TOTMONEY:6, TOTNUM:7 };
  const styleFor = { text:S.TEXT, date:S.DATE, money:S.MONEY, num:S.NUM };
  const totalStyle = { money:S.TOTMONEY, num:S.TOTNUM };

  const cell = (ref, style, type, value) => {
    if (value === null || value === undefined || value === "")
      return `<c r="${ref}" s="${style}"/>`;
    if (type === "text")
      return `<c r="${ref}" s="${style}" t="inlineStr"><is><t xml:space="preserve">${xesc(value)}</t></is></c>`;
    return `<c r="${ref}" s="${style}"><v>${value}</v></c>`;
  };

  let sheet = "";
  sheet += `<row r="1" ht="22" customHeight="1">` +
    cols.map((c,i) => cell(colName(i)+"1", S.HEAD, "text", c.label)).join("") + `</row>`;

  rows.forEach((r, ri) => {
    const rn = ri + 2;
    sheet += `<row r="${rn}">` + cols.map((c,i) => {
      const ref = colName(i) + rn;
      const v = r[c.key];
      if (c.type === "date"){ const s = dateSerial(v); return cell(ref, S.DATE, "num", s); }
      if (c.type === "money" || c.type === "num"){
        const n = (v === "" || v === null || v === undefined) ? null : Number(v);
        return cell(ref, styleFor[c.type], "num", (n === null || isNaN(n)) ? null : n);
      }
      return cell(ref, S.TEXT, "text", v);
    }).join("") + `</row>`;
  });

  // totals row
  const totRow = rows.length + 2;
  const totalable = cols.some(c => c.type === "money" || c.type === "num");
  if (rows.length && totalable){
    sheet += `<row r="${totRow}">` + cols.map((c,i) => {
      const ref = colName(i) + totRow;
      if (i === 0) return cell(ref, S.TOTLBL, "text", `Total — ${rows.length} entries`);
      if (c.type === "money" || c.type === "num"){
        const col = colName(i);
        return `<c r="${ref}" s="${totalStyle[c.type]}"><f>SUM(${col}2:${col}${totRow-1})</f></c>`;

  const styles =
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

/* ---------- PDF ---------- */
/* Helvetica base-14, WinAnsi. The rupee sign is not in that encoding,
   so money reads as "Rs" in the PDF. */
const HELV_W = {}; // filled below from the standard AFM widths
(function(){
  const w = "278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584";
  const arr = w.split(",").map(Number);
  for (let i = 0; i < arr.length; i++) HELV_W[32 + i] = arr[i];
})();
function textWidth(s, size, bold){
  let w = 0;
  for (const ch of String(s)){
    const c = ch.charCodeAt(0);
    w += (HELV_W[c] ?? 556) * (bold ? 1.06 : 1);
  }
  return w * size / 1000;
}
function winAnsi(s){
  return String(s ?? "")
    .replace(/\u20B9/g, "Rs ")                        // rupee sign is not in WinAnsi
    .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014]/g, "-").replace(/\u00A0/g, " ")
    .replace(/[^\x20-\x7E\xA0-\xFF]/g, "");
}
/* PDF bytes are Latin-1, one byte per character: this keeps the xref
   offsets (counted in characters) equal to real byte offsets, and lets
   WinAnsiEncoding render the high characters correctly. */
function latin1(str){
  const out = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xFF;
  return out;
}
const pesc = s => winAnsi(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
function ellipsize(s, size, bold, maxW){
  s = winAnsi(s);
  if (textWidth(s, size, bold) <= maxW) return s;
  while (s.length && textWidth(s + "...", size, bold) > maxW) s = s.slice(0, -1);
  return s + "...";
}

/**
 * cols: [{key,label,w,align}]  w = column width in points
 * rows: array of plain objects (values already formatted as strings)
 */
function buildPdf(cols, rows, meta = {}){
  const PW = 842, PH = 595;                 // A4 landscape, points
  const M = 32;
  const HEAD_H = 58, ROW_H = 17, FOOT_H = 26;
  const bodyTop = PH - M - HEAD_H;
  const bodyBottom = M + FOOT_H;
  const perPage = Math.max(1, Math.floor((bodyTop - bodyBottom - 20) / ROW_H));
  const pages = [];
  for (let i = 0; i < Math.max(rows.length, 1); i += perPage) pages.push(rows.slice(i, i + perPage));

  const totalW = cols.reduce((n,c) => n + c.w, 0);
  const scale = (PW - 2*M) / totalW;
  const cw = cols.map(c => c.w * scale);
  const xs = []; let acc = M;
  for (const w of cw){ xs.push(acc); acc += w; }

  const streams = pages.map((pageRows, pi) => {
    const out = [];
    // always restate the fill colour: a preceding rect() would otherwise
    // bleed its colour into the glyphs
    const T = (x, y, size, bold, str, grey = "0.08") =>
      out.push(`${grey} g BT /F${bold?2:1} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm (${pesc(str)}) Tj ET`);
    const line = (x1,y1,x2,y2,wd,g) =>
      out.push(`${g} G ${wd} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    const rect = (x,y,w,h,rgb) =>
      out.push(`${rgb} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);

    // masthead
    T(M, PH - M - 12, 17, true, meta.title || "Dispatch Register");
    if (meta.subtitle) T(M, PH - M - 28, 9, false, meta.subtitle, "0.35");
    if (meta.filters)  T(M, PH - M - 40, 8, false, meta.filters, "0.45");
    line(M, PH - M - 46, PW - M, PH - M - 46, 1.2, "0.1");

    // header band
    const hy = bodyTop - 16;
    rect(M, hy - 4, PW - 2*M, 18, "0.93 0.95 0.98");
    cols.forEach((c, i) => {
      const lab = ellipsize(c.label, 7.5, true, cw[i] - 8);
      const tx = c.align === "right" ? xs[i] + cw[i] - 5 - textWidth(lab, 7.5, true) : xs[i] + 5;
      T(tx, hy + 2, 7.5, true, lab, "0.12");
    });
    line(M, hy - 4, PW - M, hy - 4, 0.8, "0.45");

    // rows
    let y = hy - 4;
    pageRows.forEach((r, ri) => {
      y -= ROW_H;
      if (ri % 2 === 1) rect(M, y, PW - 2*M, ROW_H, "0.975 0.978 0.985");
      cols.forEach((c, i) => {
        const raw = r[c.key] ?? "";
        const s = ellipsize(raw, 8, false, cw[i] - 10);
        const tx = c.align === "right" ? xs[i] + cw[i] - 5 - textWidth(s, 8, false) : xs[i] + 5;
        T(tx, y + 5, 8, false, s);
      });
      line(M, y, PW - M, y, 0.35, "0.82");
    });
    if (!rows.length) T(M + 5, y - 20, 9, false, "No entries match the current filters.", "0.45");

    // totals, once, under the last row of the last page
    if (meta.totals && rows.length && pi === pages.length - 1){
      y -= ROW_H;
      line(M, y + ROW_H, PW - M, y + ROW_H, 0.9, "0.35");
      cols.forEach((c, i) => {
        const v = meta.totals[c.key];
        if (!v) return;
        const s2 = ellipsize(v, 8, true, cw[i] - 10);
        const tx = c.align === "right" ? xs[i] + cw[i] - 5 - textWidth(s2, 8, true) : xs[i] + 5;
        T(tx, y + 5, 8, true, s2);
      });
      if (meta.totals.__label)
        T(xs[0] + 5, y + 5, 8, true,
          ellipsize(meta.totals.__label, 8, true, cw[0] + cw[1] + cw[2] - 10));
      line(M, y, PW - M, y, 0.9, "0.35");
    }

    // footer
    line(M, M + 16, PW - M, M + 16, 0.6, "0.6");
    T(M, M + 5, 7.5, false, meta.footer || "", "0.45");
    const pn = `Page ${pi+1} of ${pages.length}`;
    T(PW - M - textWidth(pn, 7.5, false), M + 5, 7.5, false, pn, "0.45");
    return out.join("\n");
  });

  // assemble
  const objs = [];
  const add = s => { objs.push(s); return objs.length; };          // 1-based ids
  const kidIds = [];
  const pagesId = 1;                                               // reserved
  objs.push("");                                                   // placeholder for Pages
  const fontR = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const fontB = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  for (const st of streams){
    const cid = add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);
    const pid = add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${PW} ${PH}] ` +
      `/Resources << /Font << /F1 ${fontR} 0 R /F2 ${fontB} 0 R >> >> /Contents ${cid} 0 R >>`);
    kidIds.push(pid);
  }
  objs[0] = `<< /Type /Pages /Count ${kidIds.length} /Kids [${kidIds.map(i => i + " 0 R").join(" ")}] >>`;
  const catId = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);

  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  objs.forEach((body, i) => {
    offsets.push(pdf.length);
    pdf += `${i+1} 0 obj\n${body}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= objs.length; i++) pdf += String(offsets[i]).padStart(10,"0") + " 00000 n \n";
  pdf += `trailer\n<< /Size ${objs.length + 1} /Root ${catId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return latin1(pdf);
}

const $ = (s, r=document) => r.querySelector(s);

function trackHref(o){
  const c = courierFor(o.transport);

/** Days from the party's order reaching you to the goods leaving. */
function turnaround(o){
  if (!o.order_date || !o.dispatch_date) return null;
  const a = Date.parse(o.order_date + "T00:00:00Z"), b = Date.parse(o.dispatch_date + "T00:00:00Z");
  if (isNaN(a) || isNaN(b)) return null;
  const d = Math.round((b - a) / 86400000);
  return d < 0 ? null : d;

function ago(iso){
  if (!iso) return "";
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 2) return "just now";
  if (mins < 60) return mins + " min ago";
  const h = Math.round(mins / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

  if (options.body && typeof options.body !== "string"){
    init.body = JSON.stringify(options.body);
    init.headers["Content-Type"] = "application/json";
  }
  let response;
  try { response = await fetch(`/api${path}`, init); }
  catch (error){ throw { message:"Cannot reach the application server. Check that it is running.", cause:error }; }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw { ...data, status:response.status };
  return data;
}
function friendly(err){
  const m = (err?.message || "") + " " + (err?.details || "");
  if (err?.code === "23505" || /duplicate key/i.test(m)) return "That invoice number is already in the register.";
  if (err?.status === 403 || err?.code === "42501" || /row-level security|permission denied|not allowed/i.test(m))
    return "Your account is not allowed to do that. Ask an admin.";
  if (/check constraint/i.test(m)) return "One of the values is not allowed — check the freight and amount fields.";
  if (err?.code === "invalid_credentials" || /Invalid login credentials|email and password do not match/i.test(m)) return "That email and password do not match.";
  if (/Email not confirmed/i.test(m)) return "This account still needs its email confirmed.";
  if (err?.status === 503 || /Failed to fetch|NetworkError|Cannot reach the application server|PostgreSQL is unreachable/i.test(m)) return "Cannot reach the application server or PostgreSQL. Check the server configuration.";
  return err?.message || "Something went wrong.";
}

/* ---------------- filtering ---------------- */
function filtered(){
  const q = view.q.trim().toLowerCase();
  let from = view.from, to = view.to;
  if (view.range === "today"){ from = to = today(); }
  else if (view.range === "7"){ from = shift(-6); to = today(); }
  else if (view.range === "30"){ from = shift(-29); to = today(); }

  const out = orders.filter(o => {
    if (q){
      const hay = [o.inv_no,o.party,o.pincode,o.area,o.state_name,o.transport,o.docket,o.remarks,
                   o.contact,o.gstin,o.telecaller,nameOf(o.created_by)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    const d = o[view.dateField];
    if (from && (!d || d < from)) return false;
    if (to   && (!d || d > to)) return false;
    if (view.pay       && o.payment_status !== view.pay) return false;
    if (view.freight   && o.freight_mode !== view.freight) return false;
    if (view.status    && o.status     !== view.status) return false;
    if (view.transport && o.transport  !== view.transport) return false;
    if (view.area      && o.area       !== view.area) return false;
    if (view.tc        && (o.telecaller||"") !== view.tc) return false;
    if (view.by        && o.created_by !== view.by) return false;
    return true;
  });
  const k = view.sort, dir = view.dir;
  out.sort((a,b) => {
    if (["amount","cases","inv_no","freight","weight","pincode"].includes(k)){
      const x = parseFloat(String(a[k]).replace(/[^0-9.-]/g,"")) || 0;
      const y = parseFloat(String(b[k]).replace(/[^0-9.-]/g,"")) || 0;
      return (x - y) * dir;
    }
    return String(a[k] ?? "").localeCompare(String(b[k] ?? "")) * dir;
  });
  return out;
}

/* ---------------- rendering ---------------- */
function renderKpis(rows){
  let amt=0, cases=0, freight=0, deliv=0, cod=0, due=0, codDue=0;
  for (const o of rows){
    amt += Number(o.amount)||0; cases += Number(o.cases)||0;
    freight += Number(o.freight)||0;
    if (o.freight_mode === "COD") cod += Number(o.freight)||0;
    due += outstanding(o);
    if (o.payment_status === "COD") codDue += Number(o.amount)||0;
    if (o.status === "Delivered") deliv++;
  }
  const pct = amt ? Math.round(due/amt*100) : 0;
  const tile = (l,v,s) => `<div class="kpi"><span class="k-label">${l}</span><span class="k-val">${v}</span><span class="k-sub">${esc(s)}</span></div>`;
  $("#kpis").innerHTML =
    tile("Dispatches", rows.length, plural(rows.length,"consignment","consignments")) +
    tile("Cases sent", nf(cases), cases ? "across " + plural(rows.length,"dispatch","dispatches") : "nothing yet") +
    tile("Invoice value", compact(amt), rupee(amt)) +
    `<div class="kpi is-alert"><span class="k-label">Outstanding</span>
       <span class="k-val">${compact(due)}</span>
       <span class="k-sub">${pct}% unpaid${codDue ? " · " + compact(codDue) + " on COD" : ""}</span>
       <span class="meter"><span style="width:${Math.min(100,pct)}%"></span></span></div>` +
    tile("Freight", compact(freight), cod ? rupee(cod) + " of it to pay (COD)" : "all settled by you or on credit") +
    tile("Delivered", `${deliv} / ${rows.length}`, rows.length ? Math.round(deliv/rows.length*100) + "% closed" : "—");
}

  const on = view.sort === key;
  return `<th class="sortable ${on?"on ":""}${cls||""}" data-sort="${key}">${label}<span class="arrow">${on ? (view.dir>0?"↑":"↓") : "↕"}</span></th>`;
}

function docketCell(o){
  const d = (o.docket || "").trim();
  if (!d) return '<div class="t-sub mono dim">no docket</div>';
  const href = trackHref(o);
  if (!href) return `<div class="t-sub mono">${esc(d)}</div>`;
  const direct = isDirectLink(o);
  const tip = direct
    ? `Open this consignment on the ${courierFor(o.transport).transport_name} website`
    : `Opens the ${courierFor(o.transport).transport_name} tracking page — the docket number is copied for you to paste`;
  return `<a class="t-sub mono docket-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer"
    data-copy="${direct ? "" : esc(d)}" title="${esc(tip)}">${esc(d)}</a>`;
}
function trackHint(o){
  if (!(o.docket || "").trim()) return "";
  if (!courierFor(o.transport).trackable)
    return '<div class="t-sub dim">no online tracking</div>';
  if (o.tracking_checked_at)
    return `<div class="t-sub dim">checked ${esc(ago(o.tracking_checked_at))}</div>`;
  return '<div class="t-sub dim">not checked yet</div>';
}
function renderPanels(rows){
  const byTc = new Map(), byTrans = new Map(), byParty = new Map();
  for (const o of rows){
    const due = outstanding(o);
    if (due > 0){
      const p = o.party || "Unnamed party";
      const e = byParty.get(p) || { due:0, n:0, oldest:null, cod:0 };
      e.due += due; e.n++;
      if (o.payment_status === "COD") e.cod += Number(o.amount)||0;
      if (!e.oldest || (o.dispatch_date && o.dispatch_date < e.oldest)) e.oldest = o.dispatch_date;
      byParty.set(p, e);
    }
    const t = o.telecaller || "Not assigned";
    const e = byTc.get(t) || {n:0, amt:0, parties:new Set()};
    e.n++; e.amt += Number(o.amount)||0; e.parties.add(o.party);
    byTc.set(t, e);
    const tr = o.transport || "Not recorded";
    const f = byTrans.get(tr) || {n:0, cases:0, freight:0};
    f.n++; f.cases += Number(o.cases)||0; f.freight += Number(o.freight)||0;
    byTrans.set(tr, f);
  }
  const tcs = [...byTc].sort((a,b) => b[1].amt - a[1].amt);
  const trs = [...byTrans].sort((a,b) => b[1].n - a[1].n);
  const maxAmt = tcs[0]?.[1].amt || 1, maxN = trs[0]?.[1].n || 1;

  const h1 = tcs.length ? tcs.map(([k,v]) => `
    <div class="brow"><span class="bname">${esc(k)}</span><span class="bval">${compact(v.amt)}</span>
    <span class="bbar"><span style="width:${Math.max(3, v.amt/maxAmt*100)}%"></span></span>
    <span class="bsub">${plural(v.n,"dispatch","dispatches")} · ${plural(v.parties.size,"party","parties")}</span></div>`).join("")
    : '<div class="empty">No dispatches in this view.</div>';
  const h2 = trs.length ? trs.map(([k,v]) => `
    <div class="brow"><span class="bname">${esc(k)}</span><span class="bval">${v.n}</span>
    <span class="bbar"><span style="width:${Math.max(3, v.n/maxN*100)}%"></span></span>
    <span class="bsub">${plural(v.cases,"case","cases")}${v.freight ? " · freight " + rupee(v.freight) : ""}</span></div>`).join("")
    : '<div class="empty">No consignments in this view.</div>';

  const parties = [...byParty].sort((a,b) => b[1].due - a[1].due);
  const maxDue = parties[0]?.[1].due || 1;
  const h0 = parties.length ? parties.map(([k,v]) => `
    <div class="brow due"><span class="bname">${esc(k)}</span><span class="bval">${rupee(v.due)}</span>
    <span class="bbar"><span style="width:${Math.max(3, v.due/maxDue*100)}%"></span></span>
    <span class="bsub">${plural(v.n,"invoice","invoices")}${v.cod ? " · " + rupee(v.cod) + " on COD" : ""}${
      v.oldest ? " · since " + dmy(v.oldest) : ""}</span></div>`).join("")
    : '<div class="empty">Every invoice in this view is paid.</div>';

  $("#panels").innerHTML = `
    <section class="panel"><div class="panel-h"><h3>Outstanding by party</h3>
      <span class="hint">${parties.length} ${parties.length === 1 ? "party" : "parties"}</span></div>
      <div class="panel-b">${h0}</div></section>

/* ---------------- courier tracking ----------------
   The lookup runs on the server, never here: the courier API key
   must stay secret, and courier APIs refuse calls from a web page. */
async function callTrack(body){
  return apiRequest("/track", { method:"POST", body });
}
/** Returns false if tracking is not set up, so callers can stay quiet about it. */
async function track(body, { quiet = false } = {}){
  try {
    const r = await callTrack(body);
    if (r && r.configured === false){
      trackReady = false;
      if (!quiet) toast(r.message || "Courier tracking is not set up yet.", "bad");
      return false;
    }
    trackReady = true;
    return r;
  } catch (err){
    if (!quiet) toast("Could not reach the tracking service. " + friendly(err), "bad");
    return false;
  }
}

/** Hand finished bytes to the browser, whichever host we are running in. */
async function deliver(name, bytes, mime){
  if (globalThis.claude?.use){                      // inside a Claude artifact
    const dl = await globalThis.claude.use("downloads");
    if (dl){
      try { await dl.save({ filename:name, data:bytes }); toast("Exported " + name); }
      catch (e){
        const c = e?.code;
        if (c === "declined") toast("Export cancelled.");
        else if (c === "rejected_extension" || c === "extension_not_enabled")
          toast(`${name.split(".").pop().toUpperCase()} downloads are blocked in this preview — this works in the installed app.`, "bad");
        else toast("Could not export here.", "bad");
      }
      return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type:mime }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Exported " + name);
}

function filterSummary(){
  const bits = [];
  if (view.q) bits.push(`search "${view.q}"`);
  const r = { today:"today", "7":"last 7 days", "30":"last 30 days" }[view.range];
  if (r) bits.push(r);
  else if (view.range === "custom" && (view.from || view.to))
    bits.push(`${view.from ? dmy(view.from) : "start"} to ${view.to ? dmy(view.to) : "today"}`);
  const dfLabel = { dispatch_date:"dispatch date", order_date:"order received", inv_date:"invoice date" }[view.dateField];
  if (bits.length && dfLabel !== "dispatch date") bits.push(`dates by ${dfLabel}`);
  if (view.pay)       bits.push(`payment ${view.pay}`);
  if (view.freight)   bits.push(`freight ${view.freight}`);
  if (view.status)    bits.push(view.status);
  if (view.transport) bits.push(view.transport);
  if (view.area)      bits.push(view.area);
  if (view.tc)        bits.push(`telecaller ${view.tc}`);
  if (view.by)        bits.push(`entered by ${nameOf(view.by)}`);
  return bits.length ? "Filters: " + bits.join(" · ") : "All entries, no filters applied";
}

  const bytes = buildPdf(PCOLS, prows, {
    title: "Dispatch Register",
    subtitle: `${plural(rows.length,"consignment","consignments")}` +
      (due ? ` · ${rupee(due)} outstanding` : "") + ` · printed ${dmy(today())}`,
    filters: filterSummary(),
    footer: `Dispatch Register · exported by ${profile.full_name || me.email}`,
    totals: rows.length ? {
      __label: `Total — ${plural(rows.length,"consignment","consignments")}`,
      cases: nf(cases), amount: rupee(amount), freight: rupee(freight)
    } : null
  });
  await deliver(`dispatch-register-${today()}.pdf`, bytes, "application/pdf");
}

/* ---------------- wiring ---------------- */
function wire(){
  let t;
  $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { view.q = e.target.value; refresh(); }, 130); });
  document.querySelectorAll(".chip").forEach(c =>
    c.addEventListener("click", () => { view.range = c.dataset.range; syncChips(); refresh(); }));
  $("#from").addEventListener("change", e => { view.from = e.target.value; view.range = "custom"; syncChips(); refresh(); });
  $("#to").addEventListener("change",   e => { view.to   = e.target.value; view.range = "custom"; syncChips(); refresh(); });
  $("#fDateField").addEventListener("change", e => { view.dateField = e.target.value; refresh(); });
  for (const [id,key] of [["#fPay","pay"],["#fFreight","freight"],["#fStatus","status"],["#fTransport","transport"],
                          ["#fArea","area"],["#fTc","tc"],["#fBy","by"]])
    $(id).addEventListener("change", e => { view[key] = e.target.value; refresh(); });

  $("#btnReset").addEventListener("click", () => {
    view = { q:"", range:"all", from:"", to:"", dateField:view.dateField,
             pay:"", freight:"", status:"", transport:"", area:"", tc:"", by:"",
             sort:view.sort, dir:view.dir };
    $("#q").value = ""; $("#from").value = ""; $("#to").value = "";
    fillSelects(); syncChips(); refresh();
  });
  $("#btnNew").addEventListener("click", () => openForm(null));
  $("#btnPrint").addEventListener("click", () => window.print());
  $("#btnXlsx").addEventListener("click", exportExcel);
  $("#btnPdf").addEventListener("click", exportPdf);
  $("#btnOut").addEventListener("click", async () => {
    try { await apiRequest("/auth/logout", { method:"POST" }); } catch { /* clear the local screen anyway */ }
    me = null; profile = null; orders = [];
    clearInterval(liveTimer); liveTimer = null;
    loginScreen();
  });

  $("#btnSweep").addEventListener("click", async () => {
    const b = $("#btnSweep"); const label = b.innerHTML;
    b.disabled = true; b.innerHTML = ico("radar") + "Checking…";
    const r = await track({ mode:"sweep" });
    if (r){
      await reloadOrders(); fillSelects(); refresh();
      const skipped = (r.results || []).filter(x => x.skipped).length;
      toast(`Checked ${r.checked || 0} consignment${r.checked === 1 ? "" : "s"}` +
            (skipped ? ` · ${skipped} had no online tracking` : ""));
    }
    b.disabled = false; b.innerHTML = label;
  });

  $("#trkClose").addEventListener("click", () => $("#trkDlg").close());
  $("#trkCheck").addEventListener("click", async () => {
    const id = $("#trkDlg").dataset.id;
    const btn = $("#trkCheck");
    btn.disabled = true; btn.textContent = "Checking…";
    const r = await track({ mode:"refresh", order_id: id });
    if (r){
      await reloadOrders(); fillSelects(); refresh();
      const rec = orders.find(o => o.id === id);
      const res = r.result || {};
      if (rec) renderTrk(rec);
      if (res.skipped) toast(res.skipped);
      else if (res.error) toast(res.error, "bad");
      else if (!res.raw) toast("The courier has no scan for this docket yet.");
    } else { btn.disabled = false; btn.textContent = "Check now"; }
  });

  // Links to a courier's generic tracking page carry the docket number on the
  // clipboard, so there is nothing to type at the other end.
  document.addEventListener("click", async e => {
    const a = e.target.closest("[data-copy]");
    if (!a || !a.dataset.copy) return;
    try { await navigator.clipboard.writeText(a.dataset.copy); toast(`Docket ${a.dataset.copy} copied — paste it on the courier's page.`); }
    catch { /* clipboard blocked: the link still opens */ }
  });

  if ($("#btnCr")) $("#btnCr").addEventListener("click", () => { renderCrList(); $("#crDlg").showModal(); });
  if ($("#crClose")) $("#crClose").addEventListener("click", () => $("#crDlg").close());
  if ($("#crAdd")) $("#crAdd").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#crName").value.trim(), slug = $("#crSlug").value.trim();
    if (!name) return;
    if (couriers.some(c => c.transport_name.toLowerCase() === name.toLowerCase())){
      toast(`${name} is already listed.`); return;
    }
    try {
      await apiRequest("/couriers", { method:"POST", body:{
        transport_name:name, slug, trackable:true, track_url: $("#crUrl").value.trim() }});
    } catch (error){ toast(friendly(error), "bad"); return; }
    $("#crName").value = ""; $("#crSlug").value = ""; $("#crUrl").value = "";
    await loadCouriers(); renderCrList(); refresh(); toast(`${name} added.`);
  });
  if ($("#crList")) $("#crList").addEventListener("change", async e => {
    const row = e.target.closest("[data-name]"); if (!row) return;
    const name = row.dataset.name;
    const patch = e.target.hasAttribute("data-cr-track") ? { trackable: e.target.checked }
                : e.target.hasAttribute("data-cr-url")    ? { track_url: e.target.value.trim() }
                : { slug: e.target.value.trim() };
    try { await apiRequest(`/couriers/${encodeURIComponent(name)}`, { method:"PUT", body:patch }); }
    catch (error){ toast(friendly(error), "bad"); return; }
    await loadCouriers(); renderCrList(); refresh();
  });
  if ($("#crList")) $("#crList").addEventListener("click", async e => {
    const b = e.target.closest("[data-cr-del]"); if (!b) return;
    const name = b.closest("[data-name]").dataset.name;
    try { await apiRequest(`/couriers/${encodeURIComponent(name)}`, { method:"DELETE" }); }
    catch (error){ toast(friendly(error), "bad"); return; }
    await loadCouriers(); renderCrList(); refresh(); toast(`${name} removed.`);
  });

  if ($("#btnTc")) $("#btnTc").addEventListener("click", () => { renderTcList(); $("#tcDlg").showModal(); });
  $("#tcClose").addEventListener("click", () => $("#tcDlg").close());
  $("#tcAdd").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#tcName").value.trim();
    if (!name) return;
    if (tcallers.some(x => x.toLowerCase() === name.toLowerCase())){ toast(`${name} is already on the list.`); return; }
    try { await apiRequest("/telecallers", { method:"POST", body:{ name } }); }
    catch (error){ toast(friendly(error), "bad"); return; }
    $("#tcName").value = "";
    await loadTelecallers(); renderTcList(); toast(`${name} added.`);
  });
  $("#tcList").addEventListener("click", async e => {
    const b = e.target.closest("[data-tc]"); if (!b) return;
    const name = b.dataset.tc;
    try { await apiRequest(`/telecallers/${encodeURIComponent(name)}`, { method:"DELETE" }); }
    catch (error){ toast(friendly(error), "bad"); return; }
    await loadTelecallers(); renderTcList();
    toast(`${name} removed. Past entries keep the name.`);
  });

  $("#tableWrap").addEventListener("click", async e => {
    const sortTh = e.target.closest("th.sortable");
    if (sortTh){
      const k = sortTh.dataset.sort;
      if (view.sort === k) view.dir = -view.dir; else { view.sort = k; view.dir = k === "party" ? 1 : -1; }
      refresh(); return;
    }
    if (e.target.closest("#emptyReset")) return $("#btnReset").click();
    if (e.target.closest("#emptyNew")) return openForm(null);
    const b = e.target.closest("[data-act]"); if (!b) return;
    const rec = orders.find(o => o.id === b.closest("tr").dataset.id); if (!rec) return;
    if (b.dataset.act === "track"){ openTrk(rec); return; }
    if (b.dataset.act === "edit") openForm(rec);
    else if (b.dataset.act === "del"){
      $("#cfBody").textContent = `Invoice ${rec.inv_no} for ${rec.party} will be removed from the register for everyone.`;
      const yes = $("#cfYes"), fresh = yes.cloneNode(true);
      yes.parentNode.replaceChild(fresh, yes);
      fresh.addEventListener("click", async () => {
        $("#confirm").close();
        try { await deleteEntry(rec.id); toast(`Invoice ${rec.inv_no} deleted.`); }
        catch (err){ toast(friendly(err), "bad"); }
      });
      $("#confirm").showModal();
    }
  });

  $("#sheetClose").addEventListener("click", () => $("#sheet").close());
  $("#sheetCancel").addEventListener("click", () => $("#sheet").close());
  $("#cfNo").addEventListener("click", () => $("#confirm").close());
  $("#form").addEventListener("submit", async e => {
    e.preventDefault();
    const id = $("#form").dataset.id || null;
    const patch = readForm();
    if (!patch.inv_no || !patch.party){
      $("#formErr").textContent = "Invoice number and party name are both needed."; return;
    }
    if (patch.pincode && !/^[0-9]{6}$/.test(patch.pincode)){
      $("#formErr").textContent = "A pincode is six digits, or leave it blank."; return;
    }
    const clash = orders.find(o => o.id !== id && o.inv_no.toLowerCase() === patch.inv_no.toLowerCase());
    if (clash){ $("#formErr").textContent = `Invoice ${patch.inv_no} is already entered for ${clash.party}.`; return; }
    const btn = $("#sheetSave"), label = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const saved = await saveEntry(patch, id);
      $("#sheet").close();
      toast(id ? `Invoice ${patch.inv_no} updated.` : `Invoice ${patch.inv_no} added.`);
      // Hand the docket to the tracking service in the background. The courier
      // usually has nothing to report for a while, so we do not wait on it and
      // we stay silent if tracking is not set up.
      if (canTrack(saved) && trackReady !== false){
        track({ mode:"register", order_id: saved.id }, { quiet: true }).then(async r => {
          if (!r) return;
          await reloadOrders(); refresh();
        });
      }
    } catch (err){ $("#formErr").textContent = friendly(err); }
    finally { btn.disabled = false; btn.textContent = label; }
  });
}

async function startApp(){
  try { await loadAll(); }
  catch (err){
    $("#root").innerHTML = `<div class="gate"><div class="gate-card">
      <h2 class="gate-h">Cannot load the register</h2>
      <p class="gate-p">${esc(friendly(err))}</p>
      <p class="gate-p muted">If this is the first run, check that <strong>schema.sql</strong> was applied to your AWS PostgreSQL database.</p>
      <button class="btn btn-wide" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  profile = people.get(me.id) || { full_name: me.email.split("@")[0], role:"staff" };
  appShell(); fillSelects(); syncChips(); wire(); refresh(); watchLive();
}

/* ---------------- boot ---------------- */
try {
  const session = await apiRequest("/auth/me");
  me = session.user;
  await startApp();
} catch (error){
  if (error?.status === 401) loginScreen();
  else setupScreen();
}
</script>
